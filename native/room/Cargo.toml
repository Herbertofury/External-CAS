[package]
name = "external-cas-room"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
external-cas-assets = { path = "../assets" }
external-cas-scene = { path = "../scene" }
external-cas-character = { path = "../character" }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
image = { version = "=0.25.10", default-features = false, features = ["dds"] }

[dev-dependencies]
serde_json = "=1.0.154"
