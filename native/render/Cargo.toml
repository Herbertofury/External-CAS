[package]
name = "external-cas-render"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
wgpu = "=30.0.1"
external-cas-shader = { path = "../shader" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D11on12", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }

[dev-dependencies]
pollster = "=1.0.1"
serde_json = "=1.0.154"
