[package]
name = "external-cas-material"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
external-cas-assets = { path = "../assets" }
external-cas-character = { path = "../character" }
external-cas-scene = { path = "../scene" }
external-cas-morph = { path = "../morph" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "dds"] }

[dev-dependencies]
serde_json = "=1.0.154"
external-cas-tray = { path = "../tray" }
